name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

      - name: Build SSR bundle
        run: npm run build:ssr

      - name: Smoke test SSR server
        run: |
          php artisan inertia:start-ssr > storage/logs/inertia-ssr.log 2>&1 &
          SSR_PID=$!
          APP_ENV=production php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/laravel-serve.log 2>&1 &
          APP_PID=$!
          trap 'kill "$SSR_PID" "$APP_PID" 2>/dev/null || true; php artisan inertia:stop-ssr >/dev/null 2>&1 || true' EXIT
          sleep 4
          php artisan inertia:check-ssr
          response=$(curl --fail --silent http://127.0.0.1:8000/)
          case "$response" in
            *'data-server-rendered="true"'*) ;;
            *) echo "SSR markup missing"; exit 1 ;;
          esac
          case "$response" in
            *"Marco Vega"*) ;;
            *) echo "SSR identity missing"; exit 1 ;;
          esac
          case "$response" in
            *Laravel*) echo "Starter branding present"; exit 1 ;;
            *) ;;
          esac
